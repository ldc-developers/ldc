commonSteps: &commonSteps
  steps:
    # Each step starts in the checked-out source directory.
    - run:
        name: Install prerequisites
        command: |
          set -ux
          cd ..

          export DEBIAN_FRONTEND=noninteractive
          if [[ "${EXTRA_CMAKE_FLAGS:-}" = *-DMULTILIB?ON* ]]; then
            sudo dpkg --add-architecture i386
            gcc_pkg="g++-multilib"
            libcurl_pkg="libcurl4t64 libcurl4t64:i386"
          else
            gcc_pkg="g++"
            libcurl_pkg="libcurl4t64"
          fi
          sudo apt-get -q update
          sudo apt-get -yq install \
            git-core $gcc_pkg cmake ninja-build \
            llvm-$LLVM_MAJOR-dev libclang-rt-$LLVM_MAJOR-dev zlib1g-dev \
            $libcurl_pkg curl gdb python3 python3-pip tzdata unzip zip \
            ${EXTRA_APT_PACKAGES:-}

          # Install lit
          python3 --version
          python3 -m pip install --user lit psutil
          python3 -c "import lit.main; lit.main.main();" --version . | head -n 1
    - checkout
    - run:
        name: Merge PR with target branch
        command: |
          set -ux
          if [ -n "${CIRCLE_PR_NUMBER:-}" ]; then
            git fetch origin "+refs/pull/$CIRCLE_PR_NUMBER/merge:"
            git checkout -f FETCH_HEAD
          fi
    - run:
        name: Checkout git submodules
        command: git submodule update --init
    - run:
        name: Build LDC & LDC D unittests & defaultlib unittest runners
        command: |
          set -ux
          cd ..
          cmake --version
          ninja --version
          mkdir build
          cd build
          cmake -G Ninja $CIRCLE_WORKING_DIRECTORY \
            -DCMAKE_BUILD_TYPE=Release \
            ${EXTRA_CMAKE_FLAGS:-}
          ninja obj/ldc2.o all ldc2-unittest all-test-runners
          bin/ldc2 -version
    - run:
        name: Run LDC D unittests
        when: always
        command: cd ../build && ctest --output-on-failure -R ldc2-unittest
    - run:
        name: Run LIT testsuite
        when: always
        command: |
          set -ux
          # FIXME: lsan_interceptors.cpp:82 "((!lsan_init_is_running)) != (0)"
          rm tests/sanitizers/lsan_memleak.d
          cd ../build
          ctest -V -R lit-tests
    - run:
        name: Run DMD testsuite
        when: always
        command: cd ../build && ctest -V -R dmd-testsuite
    - run:
        name: Run defaultlib unittests & druntime integration tests
        when: always
        command: |
          set -ux
          excludes='dmd-testsuite|lit-tests|ldc2-unittest'
          # FIXME: https://github.com/dlang/phobos/issues/10730
          excludes+='|^std.experimental.allocator.building_blocks.allocator_list'
          cd ../build
          ctest -j$(nproc) --output-on-failure -E "$excludes" --timeout 180

version: 2.1
jobs:
  Ubuntu-24-multilib-rtSanitizers:
    <<: *commonSteps
    machine:
      image: ubuntu-2404:current
    resource_class: large.gen3
    environment:
      - LLVM_MAJOR: 18
      - EXTRA_APT_PACKAGES: ldc
      - EXTRA_CMAKE_FLAGS: "-DMULTILIB=ON -DRT_SUPPORT_SANITIZERS=ON -DBUILD_LTO_LIBS=ON"
  Ubuntu-26-sharedLibsOnly-gdmd:
    <<: *commonSteps
    machine:
      image: ubuntu-2604:current
    resource_class: large.gen3
    environment:
      - LLVM_MAJOR: 21
      # libcurl-dev required for linking ldc-profdata, due to LLVM built with non-default LLVM_ENABLE_CURL=ON
      - EXTRA_APT_PACKAGES: gdmd libcurl4-openssl-dev
      - EXTRA_CMAKE_FLAGS: "-DBUILD_SHARED_LIBS=ON -DBUILD_LTO_LIBS=ON"

workflows:
  build:
    jobs:
      - Ubuntu-24-multilib-rtSanitizers
      - Ubuntu-26-sharedLibsOnly-gdmd
